obligation_hazards:
    - class: determinism
      worst_case: GetString returns a different decoded string across calls on identical well-formed input, corrupting cache keys or byte-equality assumptions at the call site.
      severity: medium
    - class: edge_case
      worst_case: GetString on a 1-char escaped body like an empty quoted string returns an out-of-range slice or wrong length, corrupting downstream string math at the caller.
      severity: low
    - class: encoding_safety
      worst_case: GetString on a body containing invalid UTF-8 (e.g. a lone surrogate like \uDDDD) returns a Go string with invalid runes; the caller re-serializes it as invalid JSON or panics in encoding-aware downstream.
      severity: high
