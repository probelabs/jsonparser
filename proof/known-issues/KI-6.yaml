reproducer_command: go test -run TestDemoKI6 -count=1 .
tripwire_mutation: escape.go:194 — the minimum-length guard was mutated from `if len(in) < 2` to `if len(in)
  < 1`. A single-byte input `\` then passes the guard and the switch reads in[1] out of bounds. Reverting
  `< 1` back to `< 2` flips the TestDemoKI6 reproducer from PANIC back to a clean MalformedStringEscapeError.
