commands:
- go test ./... -count=1
reproducer_command: go test -run TestDemoKI11 -count=1 .
tripwire_mutation: parser.go:2137-2139 — both cases were mutated from `bytes.Equal(b, trueLiteral)` /
  `bytes.Equal(b, falseLiteral)` to `bytes.HasPrefix(...)`. Any value beginning with "true"/"false" now
  parses successfully. Reverting `bytes.HasPrefix` back to `bytes.Equal` on both lines flips the TestDemoKI11
  reproducer from silent acceptance back to MalformedValueError.
