tripwire_mutation: bytes.go:27 — the fast-path digit-count threshold was mutated from `if l-i < 19` to
  `if l-i < 20`. A 19-digit value now takes the unchecked fast path and wraps via int64 arithmetic instead
  of routing through the overflow-checked slow path. Reverting `< 20` back to `< 19` flips the TestDemoKI7
  reproducer from a wrong wrapped value back to OverflowIntegerError.
