tripwire_mutation: 'parser.go:1709 — the empty-input guard return was mutated from `MalformedObjectError` to `MalformedJsonError`, so ArrayEach on empty input surfaces an error type that disagrees with the documented contract and with arrayEachErr. Reverting `MalformedJsonError` back to `MalformedObjectError` flips the TestDemoKI12 reproducer from the wrong type back to the documented MalformedObjectError.'
