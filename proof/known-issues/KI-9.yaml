reproducer_command: go test -run TestDemoKI9 -count=1 .
tripwire_mutation: escape.go:71 — the uppercase-hex range check was mutated from `if c >= 65 && c <= 70`
  to `c <= 71`, so byte 71 (ASCII 'G') maps to value 16 instead of returning badHex. Reverting `c <= 71`
  back to `c <= 70` flips the TestDemoKI9 reproducer from silent acceptance back to MalformedStringEscapeError.
