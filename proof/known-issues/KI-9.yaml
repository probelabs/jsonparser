id: KI-9
title: h2I upper-hex bound off-by-one — byte 'G' decodes as hex 16, so `\uGxxx` is silently accepted
affected_requirements:
- SYS-REQ-014
- SYS-REQ-060
affected_api: h2I
severity: medium
severity_basis: risk
risk: correctness
cve_surface: unlikely
cvss: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N
attacker_input: a Unicode escape with an out-of-range hex digit, e.g. {"k":"\uG000"}
environment_note: Reachable via any Unescape/ParseString/Get* call decoding a `\uXXXX` escape whose first
  digit is the byte just above ASCII "F"; other malformed hex bytes are still rejected.
description: h2I (escape.go) converts one hex digit to its 0..15 value and returns badHex for any non-hex
  byte. On the proof-demo showcase branch the uppercase-hex range check was widened from `if c >= 65 &&
  c <= 70` to `c <= 71` (escape.go:71), so byte 71 — ASCII "G" — maps to value 16 instead of returning
  badHex. A `\uG000` escape is then silently accepted and decoded to a bogus code point rather than being
  rejected. This is a CWE-20 Improper Input Validation (an off-by-one on the accepted-character bound).
  Intentional demo defect on the proof-demo showcase branch; never shipped.
customer_impact: Malformed Unicode escapes that should be rejected are silently decoded to an incorrect
  character, so downstream data derived from such strings is wrong while the parse reports success. Intentional
  demo defect on the proof-demo showcase branch; never shipped.
mitigation: Validate string content against a strict JSON schema/whitelist after parsing until the hex
  bound is restored; do not treat successfully-parsed escapes as proof of well-formed input.
remediation: Restore the "A".."F" (65..70) upper bound in h2I (escape.go:71, `c <= 71` -> `c <= 70`) so
  any byte above "F" returns badHex and the enclosing escape is rejected as malformed. Closes CWE-20 Improper
  Input Validation; cf. RFC 8259 section 7.
reproduction_steps:
- Check out the proof-demo showcase branch and build the package.
- 'Call jsonparser.GetString on a value containing `\uG000` — or run: go test -run TestDemoKI9 -count=1
  .'
- Observe a decoded (bogus) code point and nil error instead of MalformedStringEscapeError.
evidence_manifests:
- proof/evidence/KI-9-reproducer.yaml
commands:
- go test ./... -count=1
reproducer_command: go test -run TestDemoKI9 -count=1 .
tripwire_mutation: escape.go:71 — the uppercase-hex range check was mutated from `if c >= 65 && c <= 70`
  to `c <= 71`, so byte 71 (ASCII 'G') maps to value 16 instead of returning badHex. Reverting `c <= 71`
  back to `c <= 70` flips the TestDemoKI9 reproducer from silent acceptance back to MalformedStringEscapeError.
