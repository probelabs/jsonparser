mitigation: 'The no-path guard (parser.go:1256) already returns a fresh zero-length slice for the root-delete case, so deleting with no keys yields an empty result that does not alias the caller''s input.'
remediation: 'No action required — the guard is present and correct; this KI documents the resolved behavior and its tripwire.'
