tripwire_mutation: 'parser.go:1256 — the no-path guard `if lk == 0 { return make([]byte, 0), true }` in deleteFoundConfig defines the root-delete contract (empty document, fresh backing array, found=true). Removing this guard, or returning the aliased input slice instead of a fresh empty slice, would flip the GREEN TestDemoKI16 reproducer to FAIL.'
