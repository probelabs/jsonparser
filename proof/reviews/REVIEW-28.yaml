comment: 'blockEnd/blockEndConfig (parser.go:376) return -1 on an unmatched bracket/brace. Callers handle it as malformed-structure: array/object skips in searchKeys return -1 (parser.go:840, parser.go:1071, parser.go:608), the object-brace skip returns -1 (parser.go:552), internalGet raises MalformedArrayError/MalformedObjectError (parser.go:1600, parser.go:1610), and the top-level array append returns MalformedArrayError (parser.go:1466). The two container-skip sites at parser.go:159/164 simply leave the index unadvanced on -1 rather than dereferencing, which is also a safe handling. MCDC Row3 sentinel-handled witness passes.'
