subject: SYS-REQ-090
decision: approved
comment: GetString called twice on identical input/path must return identical decoded strings and error values. GetString delegates to the deterministic Get and, only when a backslash is present, to ParseString (Unescape into a fresh stack buffer) — both are pure functions of their input with no shared mutable state, so results are stable across calls. TestGetStringDeterminism exercises simple, escaped, unicode, and missing-key cases twice and compares; MCDC Row2 confirms identical results for a plain string. Sound.
