subject: SYS-REQ-043
decision: approved
comment: The invariant `!input_is_truncated_mid_key | returns_error_for_truncated_mid_key` requires Get to return a parse error without panic when a key string is unterminated. In searchKeysConfig the key-scan branch calls stringEndConfig(data[i:], quote) and returns -1 when it finds no closing quote (parser.go:493-495), so `{"a` and `{"a":1,"b` yield offset -1 and internalGetConfig maps that to KeyPathNotFoundError; the whole scan is bounded by `i < ln` (parser.go:461) with no unchecked index, and `{` alone simply exhausts the loop and returns -1. Get (parser.go:1659) thus returns an error rather than panicking. TestTruncatedMidKey asserts a non-nil error on each truncated-key case, and no KI is attached.
citations:
    - parser.go:1659@Get
    - parser.go:461@searchKeysConfig
    - parser.go:493@searchKeysConfig
    - deep_spec_test.go:75@TestTruncatedMidKey
