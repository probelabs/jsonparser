comment: 'The FRETish guarantee (!getint_input_is_empty | returns_getint_error_for_empty_input) is met by pure delegation: GetInt (parser.go:2092) calls Get and returns 0,e on any non-nil Get error before type inspection. On empty input Get -> internalGetConfig (parser.go:1671) hits searchKeysConfig, which returns -1 for a missing key and yields KeyPathNotFoundError, so the empty-input clause is satisfied. TestGetIntEmptyInput and MCDC rows 2/3 confirm err!=nil on `` while row1 confirms no spurious error on non-empty `{"a":1}`. Behavior matches Get on empty input as required.'
