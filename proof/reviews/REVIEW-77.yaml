comment: ArrayEach (parser.go:1700), ObjectEach (parser.go:1910) and EachKey (parser.go:643) are single-pass iterative scanners over the input bytes with no shared state between calls, so callback order and per-callback values are a deterministic function of the input, satisfying the identical_results action. Each rebuilds its own local offset/pathFlags buffers per invocation, so no cross-call contamination is possible. TestTraversalDeterminism drives all three helpers twice and asserts element/key/result equality, passing.
