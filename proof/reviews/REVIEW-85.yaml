subject: SYS-REQ-105
decision: approved
comment: GetUnsafeString returns the raw value bytes via bytesToString and never invokes Unescape (parser.go:2034-2040), so the unescape-path demo defects (KI-14 solidus, KI-8/KI-15 surrogates) cannot corrupt or crash it. Get scans the enclosing JSON string structurally and is agnostic to interior UTF-8/BOM/ZWJ bytes, so TestGetUnsafeStringUnicodeEdgeCases (obligation_property_test.go:802) confirms no panic across BOM, raw multi-byte, emoji, and ZWJ values. The malformed-shape MCDC Row2 witness returns a clean "Key path not found" error rather than panicking, which the test explicitly accepts. All witness tests pass.
