subject: SYS-REQ-088
decision: approved
comment: For nil input Get must return a safe not-found/error result without panicking. With keys, searchKeysConfig(nil,...) returns -1 so internalGetConfig returns (nil, NotExist, -1, KeyPathNotFoundError); with no keys, nextTokenConfig(nil) returns -1 and it returns MalformedJsonError — neither path dereferences the nil slice. TestMCDC_SYS_REQ_088_Row2 asserts exactly value==nil, dataType==NotExist, offset==-1, err!=nil, and TestGetNilSafety wraps the call in a recover() guard that never fires. Sound.
