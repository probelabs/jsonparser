comment: GetUnsafeString (parser.go:2034) is a thin wrapper over Get that returns bytesToString(&v) with no mutable state, caching, or randomness, so two calls on identical input and identical key paths are structurally deterministic. TestGetUnsafeStringDeterminism (obligation_property_test.go:181) confirms v1==v2 and matching error nilness, and the MCDC Row2 witness asserts v1==v2 with both errors nil. Get is a pure read over the input slice, so the returned raw string aliases the same underlying bytes on each call. All witness tests pass and no KI touches this determinism property.
