subject: SYS-REQ-091
decision: approved
comment: GetString(nil,...) must yield an empty string plus error/not-found without panicking. It first calls Get(nil,...), which returns a non-nil error (KeyPathNotFoundError/MalformedJsonError) on nil input, so GetString returns ("", e) at the early error branch and never reaches the escape/type logic. TestMCDC_SYS_REQ_091_Row2 asserts err!=nil and v==""; TestGetStringNilSafety adds a recover() guard that does not fire. Conformant.
