comment: 'GetFloat meets !addressed_value_is_number | !raw_number_token_is_float_parseable | returns_getfloat_value: non-Number types error out with no value, and a Number token is returned via ParseFloat(v), which returns MalformedValueError when parseFloat fails (the !float_parseable disjunct). The ArrayEachErr aspect in the description also holds: arrayEachErr increments count BEFORE invoking the callback, so a callback that stops via io.EOF (graceful, nil error) or any other error returns a count that includes the stopping element — TestArrayEachErr confirms count==2 on EOF-at-2 and count==3 on error-at-3.'
