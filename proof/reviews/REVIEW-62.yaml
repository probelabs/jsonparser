decision: approved
comment: GetUnsafeString (parser.go:2032) cannot panic on truncated input because it only reads Get's return values and forwards the error; the risky indexing lives in getTypeConfig/nextToken, which return MalformedJsonError/MalformedStringError rather than reading out of bounds. For the canonical value-boundary truncation `{"a":` Get finds no token after the colon (nextTokenConfig -> -1 -> MalformedJsonError), and MCDC rows 2/3 assert err!=nil for this input; TestGetUnsafeStringTruncatedValue additionally wraps `{"a":1` in a recover() to prove no panic. The requirement's propagate-without-panic contract is met.
