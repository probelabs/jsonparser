subject: SYS-REQ-059
decision: approved
comment: The overflow-checked slow path (bytes.go:59-80) is sound and would return overflow for out-of-range magnitudes, but its gate is 'if l-i < 20' (bytes.go:40) instead of '< 19', so 19-digit literals take the unchecked fast path. max+1 '9223372036854775808' (19 digits) is therefore accumulated with plain int64 arithmetic that wraps to a negative value and returns (v,true,false) with a nil error rather than OverflowIntegerError, and min-1 '-9223372036854775809' (l-i=19) similarly wraps — directly violating the requirement. This is the open, high-severity KI-7 (CWE-190); TestParseIntOverflowBoundary would fail against this tree. Implemented with sound intent but verification honestly fails on the tracked defect.
citations:
    - bytes.go:40@parseInt
    - bytes.go:46@parseInt
    - proof/known-issues/KI-7.yaml:1
    - deep_spec_test.go:529@TestParseIntOverflowBoundary
