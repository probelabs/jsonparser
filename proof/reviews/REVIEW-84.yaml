comment: GetUnsafeString(nil, ...) flows into Get(nil, ...), whose key search returns KeyPathNotFoundError rather than indexing into the empty slice, so GetUnsafeString returns ("", err) at the early e!=nil branch without panicking (parser.go:2034-2040). The MCDC Row2 witness asserts a non-nil error and empty string on nil input, and TestGetUnsafeStringNilSafety (obligation_property_test.go:424) confirms no panic and no non-empty-without-error result. The empty-string-key panic tracked by KI-1 is not reached here because both witnesses pass a non-empty key ("a"/"key"). All witness tests pass.
