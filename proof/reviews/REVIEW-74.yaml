comment: 'GetInt, GetFloat and GetBoolean (parser.go:2093/2073/2114) are pure functions: each resolves the value via Get then hands the bytes to ParseInt/ParseFloat/ParseBoolean with no shared mutable state, randomness, or I/O, so repeated calls on identical input necessarily return identical typed values and identical errors. ParseInt (parser.go:2169) is a deterministic byte scan, confirming the action clause. TestTypedGetterDeterminism exercises all three getters twice and passes, matching the !called_twice | identical_results invariant.'
