comment: 'EachKey satisfies the multipath contract: it only fires cb(pi, v, dt, e) for a path that fully matches at the current level (len(p)==level, unused pathFlags, equalStr key match, sameTree ancestry), so missing paths emit no found-value callback; malformed input drives cb(-1,nil,Unknown,MalformedJsonError) and returns -1; and the i<ln loop completes the requested scan, returning early only once pathsMatched==len(paths). The empty-key-component panic (KI-1) is fixed here — the level<1 guard (line 708) and the len(p[level])==0 guard (line 775) prevent the out-of-range dereference, and KI-1 status is ''fixed''. TestEachKey and TestEachKeyEmptyKeyPathComponent confirm dispatch and the no-callback-on-empty-component behavior.'
