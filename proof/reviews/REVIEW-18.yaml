subject: SYS-REQ-032
decision: approved
comment: The formula requires that when a callback returns an error on a well-formed object, ObjectEach returns that same error. In objectEachConfig the value branch at parser.go:2000 invokes the callback and immediately `return err` when it is non-nil, propagating the caller's error verbatim without wrapping. TestObjectEachNestedPathAndCallbackError and TestMCDC_SYS_REQ_032_Row3 assert errors.Is(err, sentinel) for `{"a":1}`, proving the exact-error propagation, while Row1 shows a malformed input returns the parse error (not the callback sentinel), correctly gating on well-formedness.
