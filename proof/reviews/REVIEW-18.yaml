    - parser.go:1908@ObjectEach
    - parser_test.go:1926@TestObjectEachNestedPathAndCallbackError
    - mcdc_spec_witnesses_test.go:1141@TestMCDC_SYS_REQ_032_Row3_InvariantViolation
