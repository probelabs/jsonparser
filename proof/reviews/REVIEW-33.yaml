comment: 'setConfig resolves the path via internalGetConfig and, on a non-KeyPathNotFound parse error (as arises from truncated structural elements), returns nil plus that error immediately (parser.go:1409-1412). Where the path is absent it probes subpaths, and the truncated top-level cases funnel to explicit error returns: firstToken<0 -> KeyPathNotFoundError (parser.go:1443-1444), a truncated top-level array -> MalformedArrayError (parser.go:1467-1468), and non-container roots -> KeyPathNotFoundError (parser.go:1496). The truncated deep_spec cases run without panic or corrupt output.'
