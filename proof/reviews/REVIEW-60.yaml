comment: GetUnsafeString (parser.go:2032) is a thin delegate that returns "",e whenever the underlying Get call errors, so malformed input error propagation is structurally guaranteed. On `{"a"::` Get -> internalGetConfig classifies the value after the colon and fails (getTypeConfig / nextToken path), and TestGetUnsafeStringMalformedInput asserts err!=nil for exactly this input. MCDC row1 confirms no spurious error on well-formed `{"a":"b"}`. The error-propagation clause is grounded directly in the e!=nil guard.
