subject: SYS-REQ-030
decision: approved
comment: The formula requires a well-formed empty object to emit no entry callbacks. In objectEachConfig, after skipping the opening brace, the first-token check at parser.go:1939 correctly compares against '}' and returns nil before entering the entry loop, so `{}` produces zero callbacks. Note this object sentinel is genuinely correct '}' (unlike the mutated array sentinel at 1763 in SYS-REQ-028). TestObjectEach and the MC/DC witnesses (mcdc_spec_witnesses_test.go:1064 @Row3) assert zero callbacks on `{}`, and Row1 confirms a non-empty object still fires per-entry.
citations:
